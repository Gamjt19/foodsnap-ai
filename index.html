<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FoodSnap AI - Food Recognition</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #d5d8e1 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        .container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(1px);
            pointer-events: none;
        }

        .content-wrapper {
            position: relative;
            z-index: 1;
            max-width: 600px;
            width: 100%;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .logo-icon {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #ff6b6b, #ffa726);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 8px 32px rgba(255, 107, 107, 0.3);
        }

        .logo h1 {
            font-size: 48px;
            font-weight: 700;
            color: white;
            text-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            margin: 0;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 20px;
            margin-bottom: 60px;
            line-height: 1.6;
            font-weight: 300;
        }

        .upload-section {
            margin-bottom: 40px;
        }

        .upload-area {
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            padding: 60px 40px;
            transition: all 0.3s ease;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            overflow: hidden;
        }

        .upload-area:hover {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
        }

        .upload-area.dragover {
            border-color: rgba(255, 255, 255, 0.8);
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.02);
        }

        .upload-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: white;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
        }

        .upload-text {
            color: white;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 12px;
        }

        .upload-subtext {
            color: rgba(255, 255, 255, 0.7);
            font-size: 16px;
        }

        .file-input {
            display: none;
        }

        .preview-container {
            margin-top: 30px;
            border-radius: 16px;
            overflow: hidden;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .quantity-section {
            margin-bottom: 40px;
        }

        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-label {
            display: block;
            color: white;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 12px;
            text-align: left;
        }

        .quantity-input {
            width: 100%;
            padding: 20px 24px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 16px;
            font-size: 18px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            outline: none;
            color: white;
        }

        .quantity-input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .quantity-input:focus {
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.1);
        }

        .unit-label {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            font-weight: 500;
            pointer-events: none;
        }

        .preview-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .analyze-btn {
            width: 100%;
            max-width: 300px;
            padding: 20px 40px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
            margin: 0 auto;
            display: block;
        }

        .analyze-btn:hover:not(:disabled) {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(102, 126, 234, 0.5);
        }

        .analyze-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
            box-shadow: 0 4px 16px rgba(102, 126, 234, 0.2);
        }

        .loading {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 30px;
            color: white;
            font-size: 18px;
        }

        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results {
            display: none;
            margin-top: 40px;
            padding: 32px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            text-align: left;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .result-item:last-child {
            border-bottom: none;
        }

        .result-label {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.8);
            font-size: 16px;
        }

        .result-value {
            font-weight: 700;
            color: white;
            font-size: 20px;
        }

        .calories-highlight {
            background: linear-gradient(135deg, #ffffff, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .error-message {
            margin-top: 30px;
            padding: 20px;
            background: rgba(239, 68, 68, 0.15);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            color: #ff6b6b;
            font-weight: 600;
            text-align: center;
            font-size: 16px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 15px;
            }
            
            .logo h1 {
                font-size: 36px;
            }
            
            .logo-icon {
                width: 56px;
                height: 56px;
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 18px;
                margin-bottom: 40px;
            }
            
            .upload-area {
                padding: 50px 30px;
            }
            
            .upload-icon {
                width: 70px;
                height: 70px;
                font-size: 28px;
            }
            
            .upload-text {
                font-size: 20px;
            }
            
            .quantity-input {
                padding: 18px 20px;
                font-size: 16px;
            }
            
            .analyze-btn {
                font-size: 18px;
                padding: 18px 36px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px 15px;
            }
            
            .logo {
                flex-direction: column;
                gap: 12px;
            }
            
            .logo h1 {
                font-size: 28px;
            }
            
            .subtitle {
                font-size: 16px;
            }
            
            .upload-area {
                padding: 40px 20px;
            }
            
            .results {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-wrapper">
            <div class="logo">
                <div class="logo-icon">🍎</div>
                <h1>FoodSnap AI</h1>
            </div>
            
            <p class="subtitle">Upload a photo of food, and let our AI identify it for you!</p>
        
        <div class="upload-section">
            <div class="upload-area" onclick="document.getElementById('fileInput').click()">
                <div class="upload-icon">📸</div>
                <div class="upload-text">Choose Image</div>
                <div class="upload-subtext">or drag and drop your photo here</div>
                <input type="file" id="fileInput" class="file-input" accept="image/*">
            </div>
            <div id="preview" class="preview-container" style="display: none;">
                <img id="previewImage" class="preview-image" alt="Food preview">
            </div>
        </div>
        
        <div class="quantity-section">
            <div class="input-group">
                <label class="input-label" for="quantity">Food Quantity</label>
                <input type="number" id="quantity" class="quantity-input" placeholder="Quantity in grams" min="1" required>
                <span class="unit-label">grams</span>
            </div>
        </div>
        
        <button class="analyze-btn" id="analyzeBtn" onclick="analyzFood()" disabled>
            🔍 Identify Food
        </button>
        
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <span>Identifying your food...</span>
        </div>
        
        <div class="results" id="results">
            <div class="result-item">
                <span class="result-label">Predicted Food:</span>
                <span class="result-value" id="foodName">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Quantity:</span>
                <span class="result-value" id="resultQuantity">-</span>
            </div>
            <div class="result-item">
                <span class="result-label">Calories:</span>
                <span class="result-value calories-highlight" id="calories">-</span>
            </div>
        </div>
        
            <div class="error-message" id="error" style="display: none;">
                <span id="errorText"></span>
            </div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const preview = document.getElementById('preview');
        const previewImage = document.getElementById('previewImage');
        const uploadArea = document.querySelector('.upload-area');
        const analyzeBtn = document.getElementById('analyzeBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const quantityInput = document.getElementById('quantity');
        const error = document.getElementById('error');
        const errorText = document.getElementById('errorText');

        let selectedFile = null;

        // File input change handler
        fileInput.addEventListener('change', handleFileSelect);

        // Drag and drop handlers
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        function handleFileSelect(e) {
            handleFile(e.target.files[0]);
        }

        function handleFile(file) {
            if (file && file.type.startsWith('image/')) {
                selectedFile = file;
                const reader = new FileReader();
                reader.onload = (e) => {
                    previewImage.src = e.target.result;
                    preview.style.display = 'block';
                    updateAnalyzeButton();
                };
                reader.readAsDataURL(file);
                hideError();
            } else {
                showError('Please select a valid image file.');
                selectedFile = null;
                preview.style.display = 'none';
                updateAnalyzeButton();
            }
        }

        function updateAnalyzeButton() {
            const hasFile = selectedFile !== null;
            const hasQuantity = quantityInput.value && quantityInput.value > 0;
            analyzeBtn.disabled = !(hasFile && hasQuantity);
        }

        function showError(message) {
            errorText.textContent = message;
            error.style.display = 'block';
            results.style.display = 'none';
        }

        function hideError() {
            error.style.display = 'none';
        }

        quantityInput.addEventListener('input', updateAnalyzeButton);

        async function analyzFood() {
            if (!selectedFile || !quantityInput.value) {
                showError('Please select an image and enter quantity');
                return;
            }

            // Show loading state
            analyzeBtn.style.display = 'none';
            loading.style.display = 'flex';
            results.style.display = 'none';
            hideError();

            try {
                const formData = new FormData();
                formData.append('quantity', quantityInput.value);
                formData.append('file', selectedFile);

                // Make POST request to backend API
                const response = await fetch('http://localhost:8000/predict/', {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    const msg = errData.detail || 'Failed to identify the food item.';
                    throw new Error(msg);
                }

                const data = await response.json();
                
                if (data.predicted_class) {
                    // Update results
                    document.getElementById('foodName').textContent = data.predicted_class;
                    document.getElementById('resultQuantity').textContent = `${quantityInput.value}g`;
                    document.getElementById('calories').textContent = `${data.calories}`;

                    // Show results
                    results.style.display = 'block';
                    results.scrollIntoView({ behavior: 'smooth' });
                } else {
                    throw new Error('Unexpected response from server.');
                }

            } catch (err) {
                showError(err.message);
            } finally {
                // Hide loading state
                loading.style.display = 'none';
                analyzeBtn.style.display = 'block';
            }
        }

        // Initialize button state
        updateAnalyzeButton();
    </script>
</body>
</html>
